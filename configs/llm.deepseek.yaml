schema_version: 3
# Run from the repository root; the key path is relative to this file.
# api.txt is ignored by Git and is never included in model requests.
backends:
  deepseek:
    driver: openai_compatible
    base_url: https://api.deepseek.com
    api_key_file: ../api.txt
profiles:
  flash:
    backend_id: deepseek
    model: deepseek-v4-flash
    temperature: 0.4
    max_output_tokens: 4096
    extra:
      thinking: {type: disabled}
  pro:
    backend_id: deepseek
    model: deepseek-v4-pro
    temperature: 0.4
    max_output_tokens: 4096
    extra:
      thinking: {type: disabled}
cast:
  Andy: {adapter: llm, profile: flash}
  Morgan: {adapter: llm, profile: flash}
  Clara: {adapter: llm, profile: flash}
