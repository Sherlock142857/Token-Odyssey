schema_version: 3
# Replace the endpoint and model IDs with values from your provider.
# Credentials stay outside scenarios and recorded model requests.
backends:
  primary:
    driver: openai_compatible
    base_url: https://your-provider.example/v1
    api_key_env: AIRPG_API_KEY
profiles:
  standard:
    backend_id: primary
    model: your-model-id
    temperature: 0.8
    max_output_tokens: 1200
  careful:
    backend_id: primary
    model: your-other-model-id
    temperature: 0.4
    max_output_tokens: 1600
cast:
  Andy: {adapter: llm, profile: standard}
  Morgan: {adapter: llm, profile: careful}
  Clara: {adapter: llm, profile: standard}
campaign:
  director_profile: careful
  scene_builder_profile: careful
  world_summary_profile: standard
  character_memory_profile: standard
  npc_profile: standard
  max_generation_retries: 3
