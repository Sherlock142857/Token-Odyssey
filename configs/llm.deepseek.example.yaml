schema_version: 3
# Run from the repository root. Copy this file to configs/llm.local.yaml
# before making local changes. API keys are never included in prompts or run records.
backends:
  deepseek:
    driver: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: TOKEN_ODYSSEY_API_KEY
profiles:
  flash:
    backend_id: deepseek
    model: deepseek-v4-flash
    temperature: 0.4
    max_output_tokens: 4096
    extra:
      thinking: {type: disabled}
  pro:
    backend_id: deepseek
    model: deepseek-v4-pro
    temperature: 0.4
    max_output_tokens: 4096
    extra:
      thinking: {type: disabled}
  builder:
    backend_id: deepseek
    model: deepseek-v4-pro
    temperature: 0.2
    max_output_tokens: 8192
    extra:
      thinking: {type: disabled}
cast:
  Andy: {adapter: llm, profile: flash}
  Morgan: {adapter: llm, profile: flash}
  Clara: {adapter: llm, profile: flash}
campaign:
  director_profile: pro
  scene_builder_profile: builder
  world_summary_profile: flash
  character_memory_profile: flash
  npc_profile: flash
  max_generation_retries: 3
