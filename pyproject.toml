[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "token-odyssey"
version = "0.3.0"
description = "A deterministic and observable theatrical RPG runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0,<3",
    "httpx[socks]>=0.27,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "rich>=13,<15",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]

[project.scripts]
token-odyssey = "token_odyssey.interfaces.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
