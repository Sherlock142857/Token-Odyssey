name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What cannot be expressed or accomplished today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: World-authority and information-boundary impact
      description: Explain any effect on state ownership, action validation, observations, or replay.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note any CLI or current-schema changes.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
