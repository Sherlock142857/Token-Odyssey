name: Bug report
description: Report a reproducible defect in the current release
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove API keys, private prompts, and sensitive run data before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Scenario or RunConfig
        - World Harness / Act runtime
        - Web UI
        - Campaign
        - Replay / recording
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and a minimal current-schema Scenario when useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, installation command
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and sensitive model/run content.
          required: true
        - label: This is not a security vulnerability (I will use the private process in SECURITY.md for those).
          required: true
