id: rainy_night_letter
title: 雨夜遗嘱
world_history: |
  临江城的沈宅靠航运起家。老主人沈砚舟三天前突然去世，一份尚未公开的遗嘱据说仍在宅中。
  城内正经历连夜暴雨，宅中的人无法轻易离开。每个人都知道利益正在重新分配，但没人掌握全部事实。
act_background: |
  晚上九点，雷雨使沈宅短暂停电。电灯重新亮起时，管家罗闻发现书房的文件柜被翻动过。
  三个人在会客厅相遇。乌木盒一直放在矮桌上；谁先控制钥匙和遗嘱，谁就可能控制接下来的谈判。
  不要无条件合作。角色可以隐瞒、试探、拒绝、撒谎或采取秘密行动，但不能虚构世界状态。
action_guidance: |
  搜索只能针对已知容器。看不见但记得的物品仍可尝试操作，不过它可能已不在原处并被程序拒绝。
max_rounds: 50
seed: 731
