schema_version: 3
id: floodgate_dispatch
title: Greyhaven：暴雨后的药箱
public_background: >-
  暴雨刚停，Greyhaven 港口的小诊所需要一箱药。这里只有三个人：
  志愿者 Andy、港务员 Morgan 和护士 Clara。Andy 负责修好排水泵、取药；
  Morgan 留在办公室提供维修说明；Clara 留在办公室接收药箱。
  相邻泵房地面有积水，药箱放在高处的药品柜里。先修泵排水，再搬药。
  备用齿轮在办公室的工具箱里，工具箱钥匙已借给 Andy。
  本幕只需把药箱交到办公室里的 Clara 手上，并锁好工具箱、把钥匙还给 Morgan。
  去诊所的旅程发生在本幕之后。
seed: 41
max_rounds: 24
turn_policy: {max_actions: 5, continue_after_move: false, max_retries: 1}
routing:
  strategy: weighted
  interests:
    Andy: {tool_chest: 1.0, pump: 1.2, medicine: 1.2}
    Morgan: {tool_chest: 1.0, chest_key: 1.0}
    Clara: {medicine: 1.5, Andy: 0.5}
world:
  entities:
    office:
      kind: room
      name: Harbor Office
      description: 港口办公室里亮着灯，墙边放着工具箱。一扇木门通往相邻的 Pump Room。
    pump_room:
      kind: room
      name: Pump Room
      description: 地面有一道浅浅的水沟，排水泵接着沟底的管道。药品柜固定在高于水沟的平台上。
    Andy:
      kind: character
      name: Andy
      description: 穿着蓝色雨衣的年轻志愿者，答应替诊所搬运药物。
    Morgan:
      kind: character
      name: Morgan
      description: 港务员，熟悉这间办公室和排水泵的维修方法。
    Clara:
      kind: character
      name: Clara
      description: 诊所护士，带着一只空的帆布药袋。
    chest_key:
      kind: item
      name: Tool Chest Key
      size: 1
      description: 黄铜钥匙，钥匙牌上写着 Tool Chest。
    tool_chest:
      kind: item
      name: Tool Chest
      description: 木制工具箱，盖上写着“备用泵齿轮。取用后请锁好，钥匙还给 Morgan”。
      portable: false
      container: {capacity_size: 4}
      openable: {}
      lockable: {key_item_ids: [chest_key]}
    spare_gear:
      kind: item
      name: Spare Gear
      description: 完好的黄铜齿轮，轴孔形状与排水泵相配。
      size: 2
    pump:
      kind: item
      name: Drainage Pump
      description: 齿轮座旁有手柄。维修牌写着“装入备用齿轮，再扳动手柄，即可排水”。
      portable: false
      slot: {compatible_item_ids: [spare_gear]}
      operable: true
    medicine_cabinet:
      kind: item
      name: Medicine Cabinet
      description: 放在高台上的无锁木柜，柜门上画着诊所的十字标记。
      portable: false
      container: {capacity_size: 4}
      openable: {}
    medicine:
      kind: item
      name: Medicine Crate
      description: 封条完好的药箱，收件人写着“Greyhaven Clinic — Clara”。
      size: 4
  passages:
    pump_door:
      name: Pump Room Door
      rooms: [office, pump_room]
      openable: {open_visibility: 1, closed_visibility: 0, closed_sound: 0.25}
      sound: 0.8
  flag_names: [water_drained]
  mechanics:
    - id: drain_water
      trigger: operated
      subject_id: pump
      when:
        - {kind: installed, subject_id: spare_gear, object_id: pump}
      effects:
        - {kind: flag, subject_id: water_drained, value: true}
      source_id: pump
      visual_description: 齿轮带动排水泵，水沟里的积水退去，搬运药箱的地面露了出来。
      sound_description: 泵发出平稳的转动声，管道里传来流水声。
initial_state:
  placements:
    Andy: {parent_id: office}
    Morgan: {parent_id: office}
    Clara: {parent_id: office}
    chest_key: {parent_id: Andy, relation: attached}
    tool_chest: {parent_id: office}
    spare_gear: {parent_id: tool_chest}
    pump: {parent_id: pump_room}
    medicine_cabinet: {parent_id: pump_room}
    medicine: {parent_id: medicine_cabinet}
  locks: {tool_chest: true}
roles:
  Andy:
    personality: 做事直接，愿意听维修说明。会连续完成当前已知且可执行的步骤，遇到新线索或拿不准时再停下向 Morgan 询问。
    private_goal: 修泵排水，把药箱交给 Clara；取完齿轮锁好工具箱，把钥匙还给 Morgan。
    memories:
      - Morgan 已把工具箱钥匙借给你。你负责实际维修和搬药，两位同伴在办公室等你。
      - 工具箱里是备用齿轮。装到泵上后还要扳手柄，看到排水结果再搬药。
      - Clara 会在之后的行程把药送往诊所，这次只需在办公室与她交接。
    known_entity_ids: [Morgan, Clara, chest_key, tool_chest]
  Morgan:
    personality: 耐心而简洁。回答具体问题，说明一次后给 Andy 动手的机会。
    private_goal: 在办公室协助 Andy 理解维修步骤，收回工具箱钥匙。
    memories:
      - 已把工具箱钥匙借给 Andy，工具箱里有备用齿轮。
      - 修泵只需装好备用齿轮，再扳动泵的手柄。Andy 负责维修，你留在办公室等他。
      - Andy 问起步骤就清楚解释。钥匙已经归还或某一步已经完成时，不再重复催促。
    known_entity_ids: [Andy, Clara, chest_key, tool_chest, spare_gear, pump]
  Clara:
    personality: 关心药物是否完好，说话清楚。愿意等待维修，不反复催促。
    private_goal: 留在办公室，接收 Andy 交来的药箱并确认收到。
    memories:
      - 药箱在泵房高台的无锁药品柜里，Andy 会在排水后取来。
      - 你和 Andy 约好在办公室交接，之后再把药箱送回诊所。
    known_entity_ids: [Andy, Morgan, medicine, medicine_cabinet]
# Andy 是默认玩家；网页可分别选择 Human / LLM / Scripted。
cast:
  Andy: {adapter: scripted}
  Morgan: {adapter: scripted}
  Clara: {adapter: scripted}
# 离线验收由 Andy 完成主线；同伴的台词不依赖固定调度顺序。
scripts:
  Andy:
    - actions:
        - {kind: say, listener_ids: [Morgan, Clara], content: 我先取齿轮修泵，排完水就把药箱带给 Clara。}
    - actions:
        - {kind: unlock, lockable_id: tool_chest, key_item_id: chest_key}
        - {kind: open, openable_id: tool_chest}
        - {kind: search, container_id: tool_chest}
    - actions:
        - {kind: take, item_id: spare_gear}
        - {kind: close, openable_id: tool_chest}
        - {kind: lock, lockable_id: tool_chest, key_item_id: chest_key}
        - {kind: give, item_id: chest_key, recipient_id: Morgan}
    - actions:
        - {kind: open, openable_id: pump_door}
        - {kind: move, destination_room_id: pump_room}
    - actions:
        - {kind: install, item_id: spare_gear, slot_id: pump}
        - {kind: operate, device_id: pump}
    - actions:
        - {kind: open, openable_id: medicine_cabinet}
        - {kind: search, container_id: medicine_cabinet}
    - actions:
        - {kind: take, item_id: medicine}
        - {kind: close, openable_id: medicine_cabinet}
    - actions: [{kind: move, destination_room_id: office}]
    - actions: [{kind: give, item_id: medicine, recipient_id: Clara}]
  Morgan:
    - actions: [{kind: say, content: 工具箱里有备用齿轮。装好齿轮后扳动泵的手柄就能排水。我在办公室等你，有问题随时问。}]
  Clara:
    - actions: [{kind: say, content: 我在办公室接药，药箱在泵房高台上的柜子里。}]
end_when: &completion
  - {kind: flag, subject_id: water_drained}
  - {kind: installed, subject_id: spare_gear, object_id: pump}
  - {kind: attached, subject_id: medicine, object_id: Clara}
  - {kind: locked, subject_id: tool_chest}
  - {kind: attached, subject_id: chest_key, object_id: Morgan}
expected: *completion
